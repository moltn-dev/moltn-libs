[package]
name = "moltn-pages"
version = "0.1.0"
description = "File-based routing for Inertia (Vue, React, Svelte) on axum, with TypeScript types generated from Rust."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["inertia", "axum", "routing", "typescript"]
categories = ["web-programming"]

[features]
default = ["runtime"]
## Router, `#[page]` loaders, shared props and TypeScript types. Without it, only the
## `build` module is left (page scan and `moltn.ts` refresh), for build scripts and tools.
runtime = ["dep:axum", "dep:inventory", "dep:moltn-pages-macros", "dep:serde_json", "dep:tracing", "dep:ts-rs", "dep:veer"]

[dependencies]
axum = { workspace = true, optional = true }
# Enregistrement des loaders `#[page]` dispersés dans l'application.
inventory = { version = "0.3", optional = true }
moltn-pages-macros = { path = "../moltn-pages-macros", version = "0.1.0", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
# Lecture de moltn.toml (build.rs et CLI) ; déjà dans l'arbre par moltn-toolchain.
toml = "1"
tracing = { workspace = true, optional = true }
# Types TypeScript des props (même version que veer).
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }
veer = { workspace = true, features = ["axum", "ts"], optional = true }

[dev-dependencies]
async-trait.workspace = true
insta = "1"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

# Tests du routeur : demandent le runtime (axum, veer).
[[test]]
name = "router_ok"
required-features = ["runtime"]

[[test]]
name = "router_errors"
required-features = ["runtime"]
